# — `.well-known/matrix/client` de la **pile de base**, celle qui
# n'embarque pas de SFU. Elle n'annonce donc **aucun focus** : `discoverFocus()` lève
# `RtcFociMissing` et l'UI affiche une cause lisible.
#
# Annoncer un focus ici sans backend derrière — ce que faisait la version d'avant le
# 05/08/2026 — faisait réussir la découverte et mourir l'appel en 502 à la connexion.
# La pile avec RTC remplace ce fichier par `infra/rtc/well-known.conf` (même chemin de
# montage, l'overlay compose gagne).
#
# Servi par le proxy et non par Synapse : le client le lit avant toute authentification.
# Le header CORS est indispensable — sans lui la découverte échoue en silence.
location = /.well-known/matrix/client {
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    return 200 '{"m.homeserver":{"base_url":"https://$host"}}';
}

# — La délégation de serveur, **pour un seul consommateur** : `lk-jwt-service`.
#
# Il résout le nom de serveur avant d'appeler `/openid/userinfo` (chaîne
# `/.well-known/matrix/server` présente dans son binaire). Sans cette réponse, la
# résolution Matrix retombe sur `<nom>:8448`, port que cette pile ne publie pas — la
# demande de jeton échoue alors en 500 et aucun appel ne se connecte.
#
# Ce que ça ouvre, et ce que ça n'ouvre pas : ça annonce « la fédération est sur le 443 ».
# Un serveur tiers qui suivrait cette annonce n'y trouve que `/openid/userinfo` — le
# listener Synapse ne sert que la ressource `openid`, tout le reste de
# `/_matrix/federation/` est un 404 — et `federation_domain_whitelist: []` refuse par
# ailleurs toute fédération de salons. La surface publique gagne exactement un endpoint,
# qui exige un jeton OpenID valide et ne rend qu'un identifiant.
location = /.well-known/matrix/server {
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    return 200 '{"m.server":"$host:443"}';
}
