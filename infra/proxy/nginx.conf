worker_processes auto;
events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s; # DNS embarqué Docker — services spec 02 pas encore levés
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        client_max_body_size 200M; # aligné sur max_upload_size (REQ-INF-06)

        # REQ-INF-11 — API d'admin de join forcé jamais exposée : un admin ne doit pas
        # pouvoir s'ajouter à un DM et recevoir les clés Megolm suivantes.
        location ^~ /_synapse/admin/ {
            return 404;
        }

        # REQ-INF-09 — callback OIDC. nginx n'a pas de `location /` de repli :
        # sans ce préfixe le retour de Keycloak est un 404 et, `password_config`
        # étant désactivé, plus personne ne peut se connecter. Disjoint du bloc
        # admin ci-dessus, qui reste prioritaire (`^~`).
        location /_synapse/client/ {
            # `set` + variable, comme les cinq autres amonts : sans variable, nginx résout
            # le nom **une seule fois au démarrage** et garde l'IP pour toujours. Synapse
            # recréé après le proxy (un `up -d`, un `restart`) prend une autre IP dans le
            # réseau compose, et toute l'API répond alors 502 — définitivement, sans que
            # rien ne dise pourquoi. La variable force la résolution à chaque requête,
            # via le `resolver` déclaré plus haut.
            set $synapse_upstream synapse:8008;
            proxy_pass http://$synapse_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # REQ-RTC-05 (spec 02) — découverte MatrixRTC. Le corps dépend du déploiement,
        # pas du proxy : `proxy/well-known.conf` sans SFU, `rtc/well-known.conf` avec.
        # L'overlay compose monte le second au même chemin et remplace le premier.
        include /etc/nginx/well-known.conf;

        location /_matrix {
            set $synapse_upstream synapse:8008; # voir /_synapse/client/ : résolution par requête
            proxy_pass http://$synapse_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # REQ-INF-14 — seule surface publique de la passerelle push : la clé publique
        # VAPID, dont le client a besoin pour s'abonner (REQ-PSH-03). L'endpoint de
        # notification reste interne, il n'a aucune authentification — l'exposer ferait
        # de la passerelle un relais de push ouvert. `=` et non un préfixe : rien
        # d'autre de la passerelle ne doit sortir.
        location = /push/config {
            set $push_gateway_upstream push-gateway:8008;
            proxy_pass http://$push_gateway_upstream/config;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # REQ-INF-15 — service de liens d'invitation (spec 12). Le préfixe est retiré
        # par le `/` final du proxy_pass : `/invite/links` atteint `/links`.
        #
        # Contrairement à la passerelle push, tout le service est public : ses quatre
        # routes exigent chacune un jeton d'accès Matrix valide, et la limitation de
        # débit de REQ-INV-09 vit dans le service, où elle peut compter par compte.
        location /invite/ {
            set $invite_tokens_upstream invite-tokens:8009;
            proxy_pass http://$invite_tokens_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth {
            set $keycloak_upstream keycloak:8080;
            proxy_pass http://$keycloak_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend provisionné par la spec 02 (lk-jwt-service) : route déclarée ici
        # (REQ-INF-10), 502 tant que le service n'est pas déployé.
        location /livekit/jwt {
            set $livekit_jwt_upstream lk-jwt-service:8080;
            proxy_pass http://$livekit_jwt_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend provisionné par la spec 02 (SFU LiveKit), upgrade WebSocket requis.
        location /livekit/sfu {
            set $livekit_sfu_upstream livekit-sfu:7880;
            proxy_pass http://$livekit_sfu_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # REQ-INF-16 — le shard (spec 11), servi **sur le domaine du homeserver**, en
        # dernier parce que `/` est le préfixe le plus court : tous les blocs ci-dessus
        # gagnent contre lui, y compris `/auth`.
        #
        # Ce bloc n'existait pas, et son absence était un choix : le shard vivait sur une
        # origine à part (`SHARD_ORIGIN`), déclarée à Synapse une par une. Ce que ça
        # coûtait, mesuré en montant la pile — la redirection vers Keycloak répondait 302,
        # le formulaire aboutissait, et l'utilisateur restait bloqué sur
        # `/_synapse/client/oidc/callback` sans qu'aucun log ne nomme la whitelist. Même
        # origine, `SHARD_ORIGIN` vide, plus rien à tenir en phase.
        #
        # Et surtout : c'est ce qui rend le contexte sécurisé gratuit (REQ-INF-10). Sur
        # une origine en clair, `crypto.subtle` n'existe pas, le service worker ne
        # s'installe pas, et la clé de récupération ne peut pas être créée.
        #
        # Le backend n'existe que là où le shard est déployé (overlay `staging/`) : dans
        # la pile de base, `/` répond 502, comme les routes `/livekit/*` sans la spec 02.
        location / {
            # `set` + variable : voir /_matrix. Sans elle, nginx exige que `web` résolve
            # **au démarrage** et refuse de démarrer du tout quand le service est absent.
            set $web_upstream web:3000;
            proxy_pass http://$web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # REQ-RTC-08 — Element Call, servi sous son propre nom d'hôte quand l'overlay RTC
    # est monté. Inclus au niveau `http` et non dans le bloc ci-dessus : c'est un bloc
    # `server` entier, l'image d'Element Call servant son SPA à la racine d'une origine.
    # Vide dans la pile de base — voir `proxy/call.conf`.
    include /etc/nginx/call.conf;
}
