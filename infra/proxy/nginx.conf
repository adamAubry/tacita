worker_processes auto;
events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s; # DNS embarqué Docker — services spec 02 pas encore levés
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        client_max_body_size 200M; # aligné sur max_upload_size (REQ-INF-06)

        # REQ-INF-11 — API d'admin de join forcé jamais exposée : un admin ne doit pas
        # pouvoir s'ajouter à un DM et recevoir les clés Megolm suivantes.
        location ^~ /_synapse/admin/ {
            return 404;
        }

        # REQ-RTC-05 (spec 02) — découverte MatrixRTC. Servi par le proxy et non
        # par Synapse : le client le lit avant toute authentification, et le header
        # CORS est indispensable (sans lui le bouton d'appel reste inerte, sans
        # message d'erreur). Clé `org.matrix.msc4143.rtc_foci` — MSC non stabilisé,
        # relire infra/rtc/README.md avant de la figer ailleurs.
        # REQ-INF-09 — callback OIDC. nginx n'a pas de `location /` de repli :
        # sans ce préfixe le retour de Keycloak est un 404 et, `password_config`
        # étant désactivé, plus personne ne peut se connecter. Disjoint du bloc
        # admin ci-dessus, qui reste prioritaire (`^~`).
        location /_synapse/client/ {
            proxy_pass http://synapse:8008;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /.well-known/matrix/client {
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
            return 200 '{"m.homeserver":{"base_url":"https://$host"},"org.matrix.msc4143.rtc_foci":[{"type":"livekit","livekit_service_url":"https://$host/livekit/jwt"}]}';
        }

        location /_matrix {
            proxy_pass http://synapse:8008;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth {
            set $keycloak_upstream keycloak:8080;
            proxy_pass http://$keycloak_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend provisionné par la spec 02 (lk-jwt-service) : route déclarée ici
        # (REQ-INF-10), 502 tant que le service n'est pas déployé.
        location /livekit/jwt {
            set $livekit_jwt_upstream lk-jwt-service:8080;
            proxy_pass http://$livekit_jwt_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend provisionné par la spec 02 (SFU LiveKit), upgrade WebSocket requis.
        location /livekit/sfu {
            set $livekit_sfu_upstream livekit-sfu:7880;
            proxy_pass http://$livekit_sfu_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
