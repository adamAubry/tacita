# REQ-RTC-08 (spec 02) — Element Call de la **pile de base**, celle qui n'embarque pas
# de SFU. Elle n'en sert aucun : ce fichier est vide de toute directive, exprès.
#
# Même mécanique que `well-known.conf` : la pile avec overlay RTC remplace ce fichier par
# `rtc/call.conf` (même chemin de montage, l'overlay compose gagne), et c'est là que le
# bloc `server` de `call.<domaine>` apparaît.
#
# Servir Element Call sans SFU derrière donnerait un appel qui se charge puis meurt à la
# connexion — la panne que E-08 a retirée du chemin `.well-known`. Ici comme là, une pile
# sans RTC ne doit rien annoncer du tout.
