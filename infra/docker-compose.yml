name: tacita

services:
  postgres:
    image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20 # postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
      # REQ-INF-01 — Synapse refuse de démarrer sans locale C.
      POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13 # 26.7.0
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: https://${SERVER_NAME}/auth
      # REQ-INF-09 — KC_HOSTNAME ne fixe que les URLs annoncées ; sans ceci
      # Keycloak sert à la racine et l'issuer qu'il publie lui-même est en 404.
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      # REQ-INF-09 — résolus par Keycloak lui-même dans le realm importé (placeholders natifs).
      SERVER_NAME: ${SERVER_NAME}
      KEYCLOAK_OIDC_CLIENT_SECRET: ${KEYCLOAK_OIDC_CLIENT_SECRET}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/tacita.json:ro
      - keycloak-data:/opt/keycloak/data

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e # RELEASE.2025-09-07
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      # KMS mono-clé intégré : requis par MinIO pour honorer `mc encrypt set sse-s3`
      # (REQ-INF-08). En prod avec un vrai S3 (AWS...), SSE-S3 est natif, pas de KMS à gérer.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # REQ-INF-08 — crée le bucket et active SSE-S3 (défense en profondeur uniquement,
  # voir infra/LIMITES.md : l'opérateur du bucket détient ces clés).
  minio-init:
    image: minio/mc@sha256:95b5f3f7969a5c5a9f3a700ba72d5c84172819e13385aaf916e237cf111ab868 # RELEASE.2025-08-13
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" &&
        mc mb --ignore-existing local/$$S3_BUCKET &&
        mc encrypt set sse-s3 local/$$S3_BUCKET

  synapse:
    build: ./synapse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      SERVER_NAME: ${SERVER_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SYNAPSE_REGISTRATION_SHARED_SECRET: ${SYNAPSE_REGISTRATION_SHARED_SECRET}
      SYNAPSE_MACAROON_SECRET_KEY: ${SYNAPSE_MACAROON_SECRET_KEY}
      SYNAPSE_FORM_SECRET: ${SYNAPSE_FORM_SECRET}
      SYNAPSE_IP_RANGE_WHITELIST: ${SYNAPSE_IP_RANGE_WHITELIST:-[]}
      KEYCLOAK_OIDC_CLIENT_SECRET: ${KEYCLOAK_OIDC_CLIENT_SECRET}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./synapse/homeserver.yaml.tmpl:/conf/homeserver.yaml.tmpl:ro
      - synapse-data:/data

  # REQ-INF-14 — la spec 03 livre le service, la spec 01 le provisionne : sans ça, la
  # passerelle est terminée et injoignable. Synapse la contacte par son nom sur le
  # réseau du compose ; l'URL à enregistrer côté client est dans README.md.
  #
  # Aucun `ports:` volontairement. `/_matrix/push/v1/notify` n'a pas d'authentification
  # (spec 03 : la subscription complète arrive dans le payload de Synapse) — publié sur
  # l'hôte, il ferait de la passerelle un relais de push ouvert. Seule la clé publique
  # VAPID sort, par le proxy.
  push-gateway:
    build:
      context: ..
      dockerfile: apps/push-gateway/Dockerfile
    restart: unless-stopped
    environment:
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}

  # REQ-INF-10 — seul point d'entrée TLS ; routes /_matrix, /livekit/jwt, /livekit/sfu
  # (backends /livekit/* provisionnés par la spec 02, absents tant qu'elle n'est pas déployée).
  proxy:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 # nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - synapse
      - keycloak
      - push-gateway
    ports:
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro

volumes:
  postgres-data:
  keycloak-data:
  minio-data:
  synapse-data:
