# Overlay de la cible de fumée (arbitrage PM, point 9). Même patron que rtc/ :
#
#   docker compose -f docker-compose.yml -f smoke/docker-compose.yml up -d
#
# D-07 — aucun besoin de développement ne modifie un artefact de production : tout
# écart dev/prod vit ici. Chaque ligne correspond à une panne réelle rencontrée en
# montant la cible — voir infra/README.md, section « login OIDC ».
name: tacita

services:
  # la cible de fumée parle à la base du service de liens directement :
  # l'atomicité de la consommation d'un usage est une propriété de PostgreSQL, et une
  # imitation monothread la confirmerait par construction au lieu de l'éprouver.
  # Lié à la boucle locale, jamais exposé sur une interface publique, et présent dans
  # ce seul overlay.
  postgres:
    ports:
      # 55432 et non 5432 : un PostgreSQL local — ou celui d'un autre projet — sur le port par
      # défaut est courant, et le symptôme d'un conflit est un `up` qui échoue au démarrage.
      - "127.0.0.1:55432:5432"

  proxy:
    networks:
      default:
        aliases:
          # Synapse lit la découverte OIDC sur https://${SERVER_NAME}/auth/… :
          # sans cet alias le nom ne résout nulle part depuis le réseau Docker et
          # tout login répond 503. En production le nom résout publiquement.
          - ${SERVER_NAME}

  synapse:
    # Ticket OIDC — D-07 : le CA de dev s'installe **par montage au démarrage**,
    # jamais dans le Dockerfile. `SSL_CERT_FILE` ne suffisait pas : c'est une
    # convention du module `ssl` de Python, or le client HTTP de Synapse est
    # Twisted, qui prend sa racine de confiance dans le magasin OpenSSL du système.
    # L'entrypoint de production est conservé tel quel, on ne fait que le précéder.
    entrypoint: ["/bin/sh", "-c"]
    command:
      # `>/dev/null` sur la sortie standard seulement : si l'installation échoue, le
      # `&&` tue le conteneur, et on veut pouvoir lire pourquoi.
      - >
        cp /conf/dev-ca.pem /usr/local/share/ca-certificates/tacita-dev.crt &&
        update-ca-certificates >/dev/null &&
        exec /entrypoint.sh run
    environment:
      # Synapse bloque ses propres requêtes sortantes vers les plages privées
      # (protection SSRF). L'issuer résolvant vers le proxy — adresse privée — sa
      # propre découverte est refusée, et le symptôme est un timeout muet.
      SYNAPSE_IP_RANGE_WHITELIST: '["172.16.0.0/12"]'
    volumes:
      - ./proxy/certs/fullchain.pem:/conf/dev-ca.pem:ro
    # L'API d'admin est bloquée au proxy : la cible crée son compte de
    # test en parlant directement à Synapse. Lié à la boucle locale — jamais exposé
    # sur une interface publique — et présent dans ce seul overlay.
    ports:
      - "127.0.0.1:8008:8008"
