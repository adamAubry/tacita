# REQ-INF-09 — les mots de Keycloak, dans la voix du produit.
#
# **Surcharge partielle, et bornée exprès.** Keycloak porte plusieurs centaines de clés ;
# celles reprises ici sont celles qui s'affichent sur les écrans que ce déploiement peut
# servir. Les autres restent celles de Keycloak — c'est une limite assumée, pas un oubli :
# traduire tout le catalogue pour des écrans qu'aucun chemin n'atteint serait du texte que
# personne ne relit, et qui dériverait au premier bump.
#
# Trois défauts corrigés, tous les trois de la même famille que ceux des gabarits Synapse :
#
#   - `errorTitle` valait « Nous sommes désolés... ». PRODUCT.md refuse l'excuse : un
#     écran d'erreur nomme ce qui s'est passé, il ne présente pas ses condoléances.
#   - le bundle vouvoie (« Connectez-vous », « Veuillez renseigner ») quand tout le
#     produit tutoie. Le « Veuillez » part avec : c'est du remplissage poli devant un
#     impératif qui se suffit.
#   - « courriel » devient « e-mail », le mot que les utilisateurs emploient.
#
# Lu en UTF-8 par Keycloak. Les apostrophes sont doublées : les valeurs passent par
# MessageFormat, y compris celles sans paramètre — c'est la convention du bundle d'origine.

# En-tête de la carte : le nom du realm, seul. C'est `displayNameHtml` du realm qui le
# remplit, et la feuille le rend au corps de la signature des pages Synapse.
loginTitleHtml={0}

