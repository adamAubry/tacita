# ------------------------------------------------------------- Codes de secours
# **Une collision de nom, pas une préférence de style.** Keycloak appelle ces codes des
# « codes de récupération » ; Tacita appelle « clé de récupération » le secret qui
# déchiffre l'historique Matrix. Deux secrets différents, affichés une seule fois,
# recopiés à la main, aux conséquences opposées — et le même nom. Ils deviennent ici des
# **codes de secours**, et le mot « récupération » reste réservé à la clé.
