# REQ-INF-09 — thème de connexion Tacita.
#
# **Il hérite, il ne réécrit pas.** `parent=keycloak.v2` : les 33 gabarits FreeMarker de
# Keycloak restent ceux de l'image, et aucun `.ftl` ne vit dans ce répertoire. C'est
# délibéré — un gabarit recopié est figé à la version où on l'a copié, et Keycloak change
# ses formulaires d'une version à l'autre sans prévenir. Ce qu'on surcharge ici tient en
# deux fichiers : une feuille de style et un dictionnaire.
#
# Ce qui rend ça possible : `keycloak.v2` ne code aucune classe en dur, il les lit dans ce
# fichier (`kcButtonPrimaryClass`, `kcInputClass`, …) et les rend en PatternFly v5. On
# reprend donc toutes les classes du parent et on repeint PatternFly par ses variables.
#
# Version épinglée avec l'image : Keycloak 26.7.0, PatternFly v5. Relire `theme.properties`
# du parent au bump — c'est là que les noms de classes changeraient.

parent=keycloak.v2
import=common/keycloak

# `styles` **remplace** la valeur du parent, elle ne s'y ajoute pas : la feuille de
# `keycloak.v2` doit donc être renommée ici, sinon on perd toute sa mise en page. La
# nôtre vient après, et gagne à spécificité égale.
styles=css/styles.css css/tacita.css
