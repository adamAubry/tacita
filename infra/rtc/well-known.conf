# — `.well-known/matrix/client` de la pile **avec** overlay RTC.
# Monté au même chemin que `proxy/well-known.conf` : c'est l'overlay compose qui décide
# lequel des deux nginx sert, donc l'annonce du focus suit exactement le déploiement du
# SFU. Les backends `/livekit/*` existent quand ce fichier est monté, et seulement alors.
#
# Clé `org.matrix.msc4143.rtc_foci` — MSC non stabilisé, relire `infra/rtc/README.md`
# avant de la figer ailleurs.
location = /.well-known/matrix/client {
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    return 200 '{"m.homeserver":{"base_url":"https://$host"},"org.matrix.msc4143.rtc_foci":[{"type":"livekit","livekit_service_url":"https://$host/livekit/jwt"}]}';
}
