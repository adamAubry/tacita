# REQ-RTC-08 (spec 02) — Element Call de la pile **avec** overlay RTC.
#
# Un bloc `server` à part, et non une `location` sous le domaine principal : l'image
# d'Element Call sert son SPA à la racine de son origine et référence ses assets en
# chemins absolus (`/assets/...`, voir `config/nginx.conf` de la v0.23.0). Sous un
# préfixe, l'index se charge et tous les assets partent en 404.
#
# `server_name` en **expression régulière** : le bloc de base est `server_name _`,
# c'est-à-dire le défaut. nginx essaie les noms exacts, puis les regex, puis le défaut —
# `call.<domaine>` arrive donc ici, tout le reste continue vers le bloc principal. Pas
# d'envsubst, donc pas de nom de domaine templaté à tenir à jour.
#
# ⚠️ Le certificat monté depuis `proxy/certs` doit porter un SAN pour ce nom, au même
# titre que `TURN_DOMAIN` (voir README.md). Sans lui, l'iframe d'appel échoue au TLS et
# le shard affiche son délai de chargement (REQ-UIX-38) sans pouvoir en dire la cause.
server {
    listen 443 ssl;
    http2 on;
    server_name ~^call\..+$;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        set $element_call_upstream element-call:8080;
        proxy_pass http://$element_call_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
