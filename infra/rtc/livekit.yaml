# SFU LiveKit — `infra/rtc`. Rendu au démarrage par le conteneur : `__TURN_DOMAIN__`
# est substitué depuis l'environnement (LiveKit n'expande les variables d'env que
# pour `key_file`, pas pour le reste du fichier — vérifié dans pkg/config/config.go
# v1.13.5). Les clés API arrivent par l'env `LIVEKIT_KEYS`, jamais dans ce fichier.

port: 7880

rtc:
  # plage ouverte à l'identique sur le pare-feu hôte ET le groupe de
  # sécurité cloud (voir firewall/). Toute modification ici se répercute dans les
  # deux fichiers de règles ; les tests vérifient qu'ils ne divergent pas.
  # ponytail: 101 ports ≈ 50 participants simultanés, très au-dessus de l'usage
  # visé, et Docker publie un port à la fois (le défaut amont 50000-60000 coûterait
  # 10 000 règles). Passer en port unique (`udp_port: 7882`) si ça devient étroit.
  port_range_start: 50000
  port_range_end: 50100
  # repli ICE/TCP quand l'UDP sortant est bloqué ; le TURN plus bas couvre le reste
  tcp_port: 7881
  # le SFU tourne derrière le NAT Docker : sans découverte STUN de
  # l'IP publique il annoncerait une adresse de bridge injoignable.
  use_external_ip: true

# sans ceci le SFU ouvre une salle pour quiconque s'y présente,
# court-circuitant lk-jwt-service qui est la seule autorité d'autorisation.
room:
  auto_create: false

# TURN-TLS : dernier recours pour les clients derrière NAT symétrique. `domain` doit
# correspondre à un SAN du certificat monté — c'est `SERVER_NAME` lui-même, que le
# certificat porte forcément, et non un sous-domaine de plus à faire résoudre.
#
# 5349 (le port `turns` de l'IANA) et non 443, depuis le 26/08/2026 : le 443 obligeait à
# une seconde IPv4 publique, puisque le proxy l'occupe déjà. Un hôte auto-hébergé n'en a
# qu'une, et l'exigence rendait les appels indéployables là où ce dépôt est le plus
# utilisé. **Limite assumée** : un client dont le pare-feu sortant ne laisse passer que
# le 443 n'atteint plus le TURN. Il lui reste l'UDP 50000-50100 et le repli ICE/TCP 7881 ;
# c'est le NAT symétrique **plus** l'égress verrouillé qui perd le relais, pas l'un des deux.
turn:
  enabled: true
  domain: __TURN_DOMAIN__
  tls_port: 5349
  udp_port: 3478
  cert_file: /certs/fullchain.pem
  key_file: /certs/privkey.pem

logging:
  level: info
